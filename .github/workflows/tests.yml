name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.4' ]

    steps:
      - name: Checkout TigerDocs
        uses: actions/checkout@v4
        with:
          path: TigerDocs

      # tiger-core provides the test dependencies (Tiger_*, Zend_* via tigerzf, PHPUnit).
      # Public (BSD-3); the bootstrap resolves it as a sibling ../tiger-core.
      - name: Checkout tiger-core (test dependencies)
        uses: actions/checkout@v4
        with:
          repository: WebTigers/TigerCore
          path: tiger-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium
          coverage: none

      - name: Install tiger-core dev dependencies
        working-directory: tiger-core
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        working-directory: TigerDocs
        run: ../tiger-core/vendor/bin/phpunit -c phpunit.xml
